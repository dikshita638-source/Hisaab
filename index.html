<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="HISAAB — a friendly expense splitter that keeps shared spending simple. Split smart. Settle easy.">
  <meta name="theme-color" content="#BDF7C5">
  <title>HISAAB — Split smart. Settle easy.</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <svg class="svg-sprite" aria-hidden="true" width="0" height="0">
    <symbol id="i-dashboard" viewBox="0 0 24 24">
      <rect x="3.5" y="3.5" width="7" height="7" rx="1.6"></rect>
      <rect x="13.5" y="3.5" width="7" height="7" rx="1.6"></rect>
      <rect x="3.5" y="13.5" width="7" height="7" rx="1.6"></rect>
      <rect x="13.5" y="13.5" width="7" height="7" rx="1.6"></rect>
    </symbol>
    <symbol id="i-users" viewBox="0 0 24 24">
      <circle cx="9" cy="8" r="3.2"></circle>
      <path d="M3.8 19.2c.5-3 2.6-4.9 5.2-4.9s4.7 1.9 5.2 4.9"></path>
      <path d="M16.2 5.2a3 3 0 0 1 0 5.7"></path>
      <path d="M17.6 14.6c1.6.5 2.6 2.1 2.9 4.1"></path>
    </symbol>
    <symbol id="i-receipt" viewBox="0 0 24 24">
      <path d="M6 3.6h12v16.8l-2.4-1.6-2.4 1.6-2.4-1.6-2.4 1.6L6 18.8V3.6Z"></path>
      <path d="M9 8h6M9 11.5h6M9 15h3.5"></path>
    </symbol>
    <symbol id="i-settle" viewBox="0 0 24 24">
      <path d="M4 8h14"></path>
      <path d="m14.5 4.5 3.5 3.5-3.5 3.5"></path>
      <path d="M20 16H6"></path>
      <path d="M9.5 12.5 6 16l3.5 3.5"></path>
    </symbol>
    <symbol id="i-settings" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="3"></circle>
      <path d="M19.2 13.3a7.8 7.8 0 0 0 0-2.6l2-1.5-2-3.4-2.3.9a7.9 7.9 0 0 0-2.2-1.3L14.4 3h-4l-.3 2.4a7.9 7.9 0 0 0-2.2 1.3l-2.3-.9-2 3.4 2 1.5a7.8 7.8 0 0 0 0 2.6l-2 1.5 2 3.4 2.3-.9a7.9 7.9 0 0 0 2.2 1.3l.3 2.4h4l.3-2.4a7.9 7.9 0 0 0 2.2-1.3l2.3.9 2-3.4-2-1.5Z"></path>
    </symbol>
    <symbol id="i-search" viewBox="0 0 24 24">
      <circle cx="10.8" cy="10.8" r="6.3"></circle>
      <path d="m15.5 15.5 4 4"></path>
    </symbol>
    <symbol id="i-bell" viewBox="0 0 24 24">
      <path d="M6.5 9.5a5.5 5.5 0 0 1 11 0c0 4 1.5 5.5 2 6H4.5c.5-.5 2-2 2-6Z"></path>
      <path d="M10 19a2.2 2.2 0 0 0 4 0"></path>
    </symbol>
    <symbol id="i-plus" viewBox="0 0 24 24">
      <path d="M12 5v14M5 12h14"></path>
    </symbol>
    <symbol id="i-chevron-left" viewBox="0 0 24 24">
      <path d="m14.5 5-7 7 7 7"></path>
    </symbol>
    <symbol id="i-chevron-right" viewBox="0 0 24 24">
      <path d="m9.5 5 7 7-7 7"></path>
    </symbol>
    <symbol id="i-chevron-down" viewBox="0 0 24 24">
      <path d="m5 9.5 7 7 7-7"></path>
    </symbol>
    <symbol id="i-arrow-right" viewBox="0 0 24 24">
      <path d="M4 12h15"></path>
      <path d="m14 6.5 5.5 5.5-5.5 5.5"></path>
    </symbol>
    <symbol id="i-arrow-left" viewBox="0 0 24 24">
      <path d="M20 12H5"></path>
      <path d="M10 6.5 4.5 12l5.5 5.5"></path>
    </symbol>
    <symbol id="i-arrow-up-right" viewBox="0 0 24 24">
      <path d="M7 17 17 7"></path>
      <path d="M8 7h9v9"></path>
    </symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24">
      <rect x="3.5" y="5" width="17" height="15.5" rx="2.5"></rect>
      <path d="M7.5 3v4M16.5 3v4M3.5 9.5h17"></path>
    </symbol>
    <symbol id="i-wallet" viewBox="0 0 24 24">
      <path d="M4 7.5A2.5 2.5 0 0 1 6.5 5H18a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H6.5A2.5 2.5 0 0 1 4 16.5v-9Z"></path>
      <path d="M4 8h14.5"></path>
      <circle cx="16" cy="13" r="1.2"></circle>
    </symbol>
    <symbol id="i-edit" viewBox="0 0 24 24">
      <path d="M4 20h4.2L19 9.2 14.8 5 4 15.8V20Z"></path>
      <path d="m13 6.8 4.2 4.2"></path>
    </symbol>
    <symbol id="i-trash" viewBox="0 0 24 24">
      <path d="M4.5 7h15M9.5 7V4.5h5V7M6.5 7l.8 12.2a1.5 1.5 0 0 0 1.5 1.3h6.4a1.5 1.5 0 0 0 1.5-1.3L17.5 7"></path>
      <path d="M10 11v5.5M14 11v5.5"></path>
    </symbol>
    <symbol id="i-close" viewBox="0 0 24 24">
      <path d="m6 6 12 12M18 6 6 18"></path>
    </symbol>
    <symbol id="i-check" viewBox="0 0 24 24">
      <path d="m5 12.5 4.5 4.5L19 7.5"></path>
    </symbol>
    <symbol id="i-alert" viewBox="0 0 24 24">
      <path d="M12 3.8 21 20H3L12 3.8Z"></path>
      <path d="M12 9v4.5"></path>
      <path d="M12 17h.01"></path>
    </symbol>
    <symbol id="i-info" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="8.5"></circle>
      <path d="M12 11v5.5"></path>
      <path d="M12 7.5h.01"></path>
    </symbol>
    <symbol id="i-spark" viewBox="0 0 24 24">
      <path d="M12 3.5c.7 3.9 2.6 5.8 6.5 6.5-3.9.7-5.8 2.6-6.5 6.5-.7-3.9-2.6-5.8-6.5-6.5 3.9-.7 5.8-2.6 6.5-6.5Z"></path>
      <path d="M18.5 15.5c.3 1.5 1 2.2 2.5 2.5-1.5.3-2.2 1-2.5 2.5-.3-1.5-1-2.2-2.5-2.5 1.5-.3 2.2-1 2.5-2.5Z"></path>
    </symbol>
    <symbol id="i-user" viewBox="0 0 24 24">
      <circle cx="12" cy="8" r="3.5"></circle>
      <path d="M5 20c.6-3.6 3.1-5.8 7-5.8s6.4 2.2 7 5.8"></path>
    </symbol>
    <symbol id="i-download" viewBox="0 0 24 24">
      <path d="M12 4v11"></path>
      <path d="m7.5 10.5 4.5 4.5 4.5-4.5"></path>
      <path d="M5 19.5h14"></path>
    </symbol>
    <symbol id="i-database" viewBox="0 0 24 24">
      <ellipse cx="12" cy="5.5" rx="7.5" ry="2.8"></ellipse>
      <path d="M4.5 5.5v6c0 1.5 3.4 2.8 7.5 2.8s7.5-1.3 7.5-2.8v-6"></path>
      <path d="M4.5 11.5v6c0 1.5 3.4 2.8 7.5 2.8s7.5-1.3 7.5-2.8v-6"></path>
    </symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24">
      <path d="M19.5 10a7.5 7.5 0 0 0-13-3.2L4 9.5"></path>
      <path d="M4 5v4.5h4.5"></path>
      <path d="M4.5 14a7.5 7.5 0 0 0 13 3.2l2.5-2.7"></path>
      <path d="M20 19v-4.5h-4.5"></path>
    </symbol>
    <symbol id="i-minus" viewBox="0 0 24 24">
      <path d="M5 12h14"></path>
    </symbol>
  </svg>

  <div class="app">
    <aside class="sidebar">
      <button class="brand" type="button" data-nav="dashboard" aria-label="HISAAB dashboard">
        <span class="brand-mark">H<span class="brand-dot" aria-hidden="true"></span></span>
        <span class="brand-word">HISAAB</span>
      </button>

      <nav class="side-nav" aria-label="Main navigation">
        <button class="nav-item is-active" type="button" data-nav="dashboard" aria-label="Dashboard" title="Dashboard">
          <svg class="icon" aria-hidden="true"><use href="#i-dashboard"></use></svg>
          <span class="nav-label">Dashboard</span>
        </button>
        <button class="nav-item" type="button" data-nav="groups" aria-label="Groups" title="Groups">
          <svg class="icon" aria-hidden="true"><use href="#i-users"></use></svg>
          <span class="nav-label">Groups</span>
        </button>
        <button class="nav-item" type="button" data-nav="expenses" aria-label="Expenses" title="Expenses">
          <svg class="icon" aria-hidden="true"><use href="#i-receipt"></use></svg>
          <span class="nav-label">Expenses</span>
        </button>
        <button class="nav-item" type="button" data-nav="settlements" aria-label="Settlements" title="Settlements">
          <svg class="icon" aria-hidden="true"><use href="#i-settle"></use></svg>
          <span class="nav-label">Settle</span>
        </button>
        <button class="nav-item nav-settings" type="button" data-nav="settings" aria-label="Settings" title="Settings">
          <svg class="icon" aria-hidden="true"><use href="#i-settings"></use></svg>
          <span class="nav-label">Settings</span>
        </button>
      </nav>

      <span class="side-version" title="Your data is saved to the HISAAB server">API</span>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-copy">
          <p class="page-kicker" id="pageKicker">OVERVIEW</p>
          <h1 id="pageTitle">Good evening!</h1>
          <p id="pageSubtitle">Here's what's happening with your shared expenses.</p>
        </div>

        <div class="topbar-tools">
          <label class="search-box" for="globalSearch">
            <svg class="icon" aria-hidden="true"><use href="#i-search"></use></svg>
            <input id="globalSearch" type="search" placeholder="Search groups, expenses..." autocomplete="off" aria-label="Search groups and expenses">
            <kbd>/</kbd>
          </label>

          <div class="tool-wrap">
            <button class="icon-btn tool-btn" id="bellButton" type="button" data-action="toggle-bell" aria-label="Notifications" aria-expanded="false" aria-controls="bellDropdown">
              <svg class="icon" aria-hidden="true"><use href="#i-bell"></use></svg>
              <span class="notif-dot" id="bellDot" hidden></span>
            </button>

            <div class="dropdown bell-dropdown" id="bellDropdown" hidden>
              <div class="dropdown-head">
                <div>
                  <p class="dropdown-kicker">NOTIFICATIONS</p>
                  <h3>Pending settlements</h3>
                </div>
                <span class="dropdown-badge" id="bellCount">0</span>
              </div>
              <div id="bellDropdownBody"></div>
              <button class="dropdown-link" type="button" data-nav="settlements">
                View all settlements
                <svg class="icon" aria-hidden="true"><use href="#i-arrow-right"></use></svg>
              </button>
            </div>
          </div>

          <div class="tool-wrap">
            <button class="profile-chip" id="profileButton" type="button" data-action="toggle-profile" aria-label="Profile menu" aria-expanded="false" aria-controls="profileDropdown">
              <span class="avatar avatar-me" id="profileAvatar">AS</span>
              <span class="profile-text">
                <strong id="profileName">Aarav</strong>
                <span>Personal profile</span>
              </span>
              <svg class="icon chevron" aria-hidden="true"><use href="#i-chevron-down"></use></svg>
            </button>

            <div class="dropdown profile-dropdown" id="profileDropdown" hidden>
              <div class="profile-dropdown-head">
                <span class="avatar avatar-me" id="dropdownAvatar">AS</span>
                <div>
                  <strong id="dropdownName">Aarav</strong>
                  <span id="dropdownCurrency">Indian Rupee · ₹</span>
                </div>
              </div>
              <div class="dropdown-divider"></div>
              <button class="dropdown-item" type="button" data-nav="settings">
                <svg class="icon" aria-hidden="true"><use href="#i-settings"></use></svg>
                Settings
              </button>
              <button class="dropdown-item" type="button" data-action="demo-data">
                <svg class="icon" aria-hidden="true"><use href="#i-spark"></use></svg>
                Load sample data
              </button>
              <button class="dropdown-item" type="button" data-action="export-data">
                <svg class="icon" aria-hidden="true"><use href="#i-download"></use></svg>
                Export backup
              </button>
              <div class="dropdown-divider"></div>
              <button class="dropdown-item danger-item" type="button" data-action="clear-data">
                <svg class="icon" aria-hidden="true"><use href="#i-trash"></use></svg>
                Clear all data
              </button>
            </div>
          </div>
        </div>
      </header>

      <div class="view-scroll" id="viewScroll">
        <div id="mainContent" aria-live="polite"></div>
      </div>
    </main>

    <aside class="right-panel" id="rightPanel" aria-label="Daily overview"></aside>
  </div>

  <nav class="mobile-nav" aria-label="Mobile navigation">
    <button class="is-active" type="button" data-nav="dashboard">
      <svg class="icon" aria-hidden="true"><use href="#i-dashboard"></use></svg>
      <span>Home</span>
    </button>
    <button type="button" data-nav="groups">
      <svg class="icon" aria-hidden="true"><use href="#i-users"></use></svg>
      <span>Groups</span>
    </button>
    <button type="button" data-nav="expenses">
      <svg class="icon" aria-hidden="true"><use href="#i-receipt"></use></svg>
      <span>Expenses</span>
    </button>
    <button type="button" data-nav="settlements">
      <svg class="icon" aria-hidden="true"><use href="#i-settle"></use></svg>
      <span>Settle</span>
    </button>
    <button type="button" data-nav="settings">
      <svg class="icon" aria-hidden="true"><use href="#i-settings"></use></svg>
      <span>Settings</span>
    </button>
  </nav>

  <div class="toast-root" id="toastRoot" aria-live="polite" aria-atomic="false"></div>
  <div class="modal-root" id="modalRoot"></div>

  <script src="js/core.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
